<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <hr />
      <h1>Status:</h1>
      <p id="status"></p>
      <hr />
    </div>
    <div>
      <button id="btn-predict" disabled>Predict Next Random Number</button>
      <button id="btn-next-random" disabled>Get Actual Next Math.random()</button>
    </div>
    <div>
      <h3>Predictions:</h3>
      <ul id="predictions"></ul>
    </div>
    <div>
      <h3>Actual <code>Math.random()</code> output:</h3>
      <ul id="actual-next-randoms"></ul>
    </div>
    <!-- TEST LOCAL FILES  -->
    <!--<script src="./dist/umd/z3-built.worker.js"></script>-->
    <script src="coi.serviceworker.js"></script>
    <script src="umd/z3-built.js"></script>
    <script src="umd/predict-v8-randomness.js"></script>
    <!-- -->
    <script>
      function getBrowser(userAgent) {
        if (userAgent.indexOf("Chrome") > -1) {
          return "Chrome";
        } else if (userAgent.indexOf("Firefox") > -1) {
          return "Firefox";
        } else if (userAgent.indexOf("Safari") > -1) {
          return "Safari";
        } else if (userAgent.indexOf("Edge") > -1) {
          return "Edge";
        } else if (userAgent.indexOf("Opera") > -1 || userAgent.indexOf("OPR") > -1) {
          return "Opera";
        } else if (userAgent.indexOf("MSIE") > -1 || userAgent.indexOf("Trident/") > -1) {
          return "Internet Explorer";
        } else {
          return "UNRECOGNIZED";
        }
      }

      function addListItemToList(listEl, text) {
        const li = document.createElement("li");
        li.id = text;
        li.innerText = text;
        listEl.append(li);
      }

      (async () => {
        const SUPPORTED_BROWSERS = ["Firefox", "Chrome"];
        const PREDICTIONS = [];
        const ACTUAL_NEXTS = [];
        let PREDICTOR = null;

        const btnPredictNext = document.getElementById("btn-predict");
        const btnGetNextRandom = document.getElementById("btn-next-random");
        const ulGeneratedRandomNumbers = document.getElementById("random-numbers");
        const ulPredictions = document.getElementById("predictions");
        const ulNextRandoms = document.getElementById("actual-next-randoms");
        const pStatus = document.getElementById("status");

        if (PREDICTOR === null) {
          try {
            pStatus.innerText = "Working...";
            const browser = getBrowser(navigator.userAgent);
            if (!SUPPORTED_BROWSERS.includes(browser)) {
              pStatus.innerText = `Unsupported browser : ${browser}`;
              return;
            }
            const nums = Array.from({ length: 5 }, Math.random);
            PREDICTOR = await PredictV8Randomness.PredictorFactory.create(browser, nums);
            pStatus.innerText = "Ready..";
            btnPredictNext.disabled = false;
          } catch (e) {
            console.error(e);
            pStatus.innerText = e.message;
          }
        }

        btnPredictNext.addEventListener("click", async () => {
          try {
            btnGetNextRandom.disabled = true;
            btnPredictNext.disabled = true;
            const next = PREDICTOR.predictNext();
            addListItemToList(ulPredictions, next);
            PREDICTIONS.push(next);
            btnGetNextRandom.disabled = false;
            btnPredictNext.disabled = true;
          } catch (e) {
            console.error(e);
            pStatus.innerText = "Something went wrong :(";
          }
        });

        btnGetNextRandom.addEventListener("click", () => {
          const actual = Math.random();
          ACTUAL_NEXTS.push(actual);
          addListItemToList(ulNextRandoms, actual);
          btnGetNextRandom.disabled = true;
          btnPredictNext.disabled = false;
          const predicted = PREDICTIONS[PREDICTIONS.length - 1];
          const isSuccess = predicted === actual;
          if (isSuccess) {
            pStatus.innerText = `SUCCESS! Prediction '${predicted}'' equals actual '${actual}'`;
            return;
          }
          pStatus.innerText = `ERROR! Prediction '${predicted}' does not equal actual '${actual}'`;
        });

        const browser = getBrowser(navigator.userAgent);
        if (!SUPPORTED_BROWSERS.includes(browser)) {
          btnCreateRandomNumbers.disabled = true;
          btnGetNextRandom.disabled = true;
          btnPredictNext.disabled = true;
          throw new Error("Unsupported browser!");
        }
      })();
    </script>
  </body>
</html>
